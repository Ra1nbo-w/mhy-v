name: Validate sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalogs and scripts
        run: node tools/validate.cjs

      - name: Run offline regression tests
        run: |
          node tools/test-ui.cjs
          node tools/test-baozi-verification.cjs
          node tools/test-source-lifecycle.cjs
